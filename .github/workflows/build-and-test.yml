name: build and test

on:
  push:
  pull_request:
    branches: [ main ]
    paths:
      - '**.cs'
      - '**.csproj'

permissions:
  contents: read
  pull-requests: write

env:
  DOTNET_VERSION: '9.0.305' # The .NET SDK version to use

jobs:
  build-and-test:

    name: build-and-test-${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v4
        
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration ExportRelease --no-restore

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: dotnet test --no-restore --verbosity normal
        
      - name: Test with coverage
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/coverage