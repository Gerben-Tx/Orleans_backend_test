name: TODO Checker

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  find-todos:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
  
      - name: Check for Todos
        uses: phntmxyz/pr_todo_checker@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          exclude: |
            *.md
            **/addons/*
          comment_on_todo: true
          comment_body: |
            ":warning: Please review the TODOs in the PR and make sure they are resolved.\n\nIf you want to ignore this TODO, resolve this conversation."
          enable_ignore_checkbox: false # Use GitHub's native "Resolve conversation" (recommended)